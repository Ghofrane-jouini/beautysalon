spring.application.name=BeautySalon

# Base H2 : mode FICHIER en local (les données restent après redémarrage).
# La valeur après ":" est la valeur par défaut ; Docker pourra la remplacer
# plus tard avec la variable d'environnement DB_URL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/beautysalon}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate crée/met à jour les tables automatiquement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
