<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head('Clients')}"></head>
<body>
<div class="app">
    <nav th:replace="~{fragments/layout :: sidebar('clients')}"></nav>
    <main class="content">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h1>Clients</h1>
            <a th:href="@{/clients/new}" class="btn btn-rose mb-3">Ajouter un client</a>
        </div>
        <div th:replace="~{fragments/layout :: messages}"></div>

        <div class="panneau table-responsive">
            <table class="table align-middle">
                <thead><tr><th>Nom</th><th>Prénom</th><th>Téléphone</th><th>Email</th><th class="text-end">Actions</th></tr></thead>
                <tbody>
                <tr th:each="c : ${clients}">
                    <td th:text="${c.nom}"></td>
                    <td th:text="${c.prenom}"></td>
                    <td th:text="${c.telephone}"></td>
                    <td th:text="${c.email}"></td>
                    <td class="text-end">
                        <a th:href="@{/clients/{id}(id=${c.id})}" class="btn btn-sm btn-contour">Consulter</a>
                        <a th:href="@{/clients/{id}/edit(id=${c.id})}" class="btn btn-sm btn-contour">Modifier</a>
                        <form th:action="@{/clients/{id}/supprimer(id=${c.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Supprimer ce client ?');">
                            <button type="submit" class="btn btn-sm btn-outline-dark">Supprimer</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(clients)}"><td colspan="5" class="vide">Aucun client pour le moment. Ajoutez le premier.</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
