<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head('Service')}"></head>
<body>
<div class="app">
    <nav th:replace="~{fragments/layout :: sidebar('services')}"></nav>
    <main class="content">
        <h1 th:text="${service.id == null} ? 'Nouveau service' : 'Modifier le service'">Service</h1>

        <form class="panneau" th:action="@{${action}}" th:object="${service}" method="post" novalidate>
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label" for="nom">Nom</label>
                    <input type="text" id="nom" class="form-control" th:field="*{nom}">
                    <div class="text-danger small" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label" for="description">Description</label>
                    <textarea id="description" rows="3" class="form-control" th:field="*{description}"></textarea>
                    <div class="text-danger small" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="prix">Prix (DT)</label>
                    <input type="number" step="0.01" min="0" id="prix" class="form-control" th:field="*{prix}">
                    <div class="text-danger small" th:if="${#fields.hasErrors('prix')}" th:errors="*{prix}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="dureeMinutes">Durée (minutes)</label>
                    <input type="number" min="1" id="dureeMinutes" class="form-control" th:field="*{dureeMinutes}">
                    <div class="text-danger small" th:if="${#fields.hasErrors('dureeMinutes')}" th:errors="*{dureeMinutes}"></div>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-rose">Enregistrer</button>
                <a th:href="@{/services}" class="btn btn-contour">Annuler</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
