<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:fragment="head(titre)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titre} + ' - BeautySalon'">BeautySalon</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="sidebar" th:fragment="sidebar(actif)">
    <div class="marque">BeautySalon</div>
    <div class="sous-titre">Espace administrateur</div>
    <a th:href="@{/}" th:classappend="${actif == 'accueil'} ? 'active'"><i class="bi bi-grid"></i>Tableau de bord</a>
    <a th:href="@{/clients}" th:classappend="${actif == 'clients'} ? 'active'"><i class="bi bi-people"></i>Clients</a>
    <a th:href="@{/services}" th:classappend="${actif == 'services'} ? 'active'"><i class="bi bi-scissors"></i>Services</a>
    <a th:href="@{/rendezvous}" th:classappend="${actif == 'rendezvous'} ? 'active'"><i class="bi bi-calendar-check"></i>Rendez-vous</a>
</nav>

<div th:fragment="messages">
    <div class="alert alert-success" th:if="${succes}" th:text="${succes}"></div>
    <div class="alert alert-danger" th:if="${erreur}" th:text="${erreur}"></div>
</div>

</body>
</html>
