name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Lancer les tests
        run: bash ./mvnw -B test

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-surefire
          path: target/surefire-reports/
          if-no-files-found: warn

  build-image:
    name: Construction de l'image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker (sans la publier)
        run: docker build -t beautysalon:ci .